name: Validate engineering baseline

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  parameter-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate master parameters
        run: python scripts/validate_parameters.py

      - name: Run resonance and NVH unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Generate engine-order baseline
        run: python scripts/engine_order_map.py --csv validation/engine_order_map.csv

      - name: Run NVH baseline screen
        run: python scripts/nvh_screen.py
